services:
  mongo:
    image: mongo:7.0
    # Replica set de um nó: transações multi-documento só existem em replica set.
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicia o replica set na primeira subida e só fica "healthy" quando há PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }; db.hello().isWritablePrimary || quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    # AOF ligado: jobs enfileirados sobrevivem a um restart do Redis.
    # Mesmo assim, a fonte da verdade é o Mongo (ver README, "Redis fora").
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/loyalty?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONCURRENCY: 10
      DEDUP_WINDOW_MS: 10000
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
